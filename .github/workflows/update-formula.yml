name: Update Webcopy Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
      sha256_darwin_arm64:
        description: 'SHA256 for darwin-arm64'
        required: true
      sha256_darwin_amd64:
        description: 'SHA256 for darwin-amd64'
        required: true
      sha256_linux_amd64:
        description: 'SHA256 for linux-amd64'
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update formula
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SHA256_DARWIN_ARM64="${{ github.event.inputs.sha256_darwin_arm64 }}"
          SHA256_DARWIN_AMD64="${{ github.event.inputs.sha256_darwin_amd64 }}"
          SHA256_LINUX_AMD64="${{ github.event.inputs.sha256_linux_amd64 }}"
          BASE_URL="https://apps-delivery.beeksiwaais.fr/webcopy"

          cat > Formula/webcopy.rb << 'FORMULA'
          class Webcopy < Formula
            desc "CLI tool to archive website HTML pages and assets for offline reading"
            homepage "https://github.com/beeksiwaais/httpcopy"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_arm do
                url "BASE_URL_PLACEHOLDER/VERSION_PLACEHOLDER/webcopy-darwin-arm64.tar.gz"
                sha256 "SHA256_DARWIN_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "BASE_URL_PLACEHOLDER/VERSION_PLACEHOLDER/webcopy-darwin-amd64.tar.gz"
                sha256 "SHA256_DARWIN_AMD64_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "BASE_URL_PLACEHOLDER/VERSION_PLACEHOLDER/webcopy-linux-amd64.tar.gz"
                sha256 "SHA256_LINUX_AMD64_PLACEHOLDER"
              end
            end

            def install
              bin.install "webcopy"
              man1.install "webcopy.1"
            end

            test do
              system "#{bin}/webcopy", "--help"
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s|VERSION_PLACEHOLDER|${VERSION#v}|g" Formula/webcopy.rb
          sed -i "s|BASE_URL_PLACEHOLDER|${BASE_URL}|g" Formula/webcopy.rb
          sed -i "s|SHA256_DARWIN_ARM64_PLACEHOLDER|${SHA256_DARWIN_ARM64}|g" Formula/webcopy.rb
          sed -i "s|SHA256_DARWIN_AMD64_PLACEHOLDER|${SHA256_DARWIN_AMD64}|g" Formula/webcopy.rb
          sed -i "s|SHA256_LINUX_AMD64_PLACEHOLDER|${SHA256_LINUX_AMD64}|g" Formula/webcopy.rb

          # Fix indentation (remove leading spaces from heredoc)
          sed -i 's/^          //' Formula/webcopy.rb

          echo "Updated formula to version ${VERSION}"
          cat Formula/webcopy.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/webcopy.rb
          git commit -m "Update webcopy formula to ${{ github.event.inputs.version }}"
          git push
